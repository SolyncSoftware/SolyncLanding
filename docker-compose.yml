version: '3.8'

services:
  solynclanding:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-solynclanding-alpha}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - ORIGIN=${ORIGIN:-https://alpha.solync.org}