name: SL Deployment (ct02-debian)

on:
    push:
        branches:
            - alpha

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Build & Run Container via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      set -e
                      APP_DIR="/opt/solynclanding"

                      if [ ! -d "$APP_DIR/.git" ]; then
                        mkdir -p $APP_DIR
                        git clone -b alpha https://github.com/SolyncSoftware/SolyncLanding.git $APP_DIR
                      fi

                      cd $APP_DIR
                      git fetch origin
                      git checkout alpha
                      git reset --hard origin/alpha

                      docker build -t solync-landing:alpha .
                      docker stop solync-landing-alpha || true
                      docker rm solync-landing-alpha || true
                      docker run -d \
                        --name solync-landing-alpha \
                        --restart unless-stopped \
                        -p 3000:3000 \
                        solync-landing:alpha
