name: Deploy Alpha Environment (Local Runner)

on:
    push:
        branches:
            - alpha

jobs:
    deploy:
        runs-on: self-hosted

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create .env file
              run: |
                  echo "CONTACT_PAGE_HOOK="${{ secrets.CONTACT_PAGE_HOOK }}"" >> .env
                  echo "APPLY_PAGE_HOOK="${{ secrets.APPLY_PAGE_HOOK }}"" >> .env

            - name: Build and Run Docker Container Locally
              run: |
                  docker build -t solync-landing:alpha .
                  docker stop solync-landing-alpha || true
                  docker rm solync-landing-alpha || true
                  docker run -d \
                    --name solync-landing-alpha \
                    --restart unless-stopped \
                    -p 3000:3000 \
                    solync-landing:alpha
